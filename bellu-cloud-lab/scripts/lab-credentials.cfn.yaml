AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Bellu Cloud Lab — bootstrap credentials. Creates a dedicated IAM user with an
  access key for running the Terraform-based lab scenarios in an ISOLATED test
  account. Deploy this ONCE in your throwaway test account; it is the only
  CloudFormation in the lab (lab scenarios themselves are Terraform). The access
  key is returned as a stack output so you can drop it into bellu-cloud-lab/.env.

  SECURITY: deploy only in a dedicated test account. The lab provisions
  intentionally-insecure resources (e.g. a security group open to 0.0.0.0/0);
  never run it in production. Delete this stack when you are done to revoke the
  key.

Parameters:
  UserName:
    Type: String
    Default: bellu-lab
    Description: Name of the IAM user the lab authenticates as.

  AccessLevel:
    Type: String
    Default: scoped
    AllowedValues: [scoped, admin]
    Description: >
      "scoped" grants only the services the Phase 1 scenarios need (EC2/VPC,
      IAM, S3, plus STS read). "admin" grants AdministratorAccess for a fully
      disposable account where convenience outweighs least-privilege.

Conditions:
  UseAdmin: !Equals [!Ref AccessLevel, admin]
  UseScoped: !Equals [!Ref AccessLevel, scoped]

Resources:
  LabUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Ref UserName
      Tags:
        - { Key: bellu-lab, Value: "true" }

  # admin path: a disposable test account where we don't fight permissions.
  AdminAttach:
    Type: AWS::IAM::UserPolicy
    Condition: UseAdmin
    Properties:
      UserName: !Ref LabUser
      PolicyName: bellu-lab-admin
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: "*"
            Resource: "*"

  # scoped path: just the services the Phase 1 scenarios create + the read
  # actions steampipe discovery needs. Broad within those services for
  # convenience (create + destroy + describe), but no access to anything else.
  ScopedAttach:
    Type: AWS::IAM::UserPolicy
    Condition: UseScoped
    Properties:
      UserName: !Ref LabUser
      PolicyName: bellu-lab-scoped
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ComputeNetworkStorage
            Effect: Allow
            Action:
              - "ec2:*"
              - "s3:*"
            Resource: "*"
          - Sid: IdentityForScenarios
            Effect: Allow
            Action:
              - "iam:CreateRole"
              - "iam:DeleteRole"
              - "iam:GetRole"
              - "iam:PassRole"
              - "iam:TagRole"
              - "iam:UntagRole"
              - "iam:ListRoles"
              - "iam:PutRolePolicy"
              - "iam:DeleteRolePolicy"
              - "iam:GetRolePolicy"
              - "iam:ListRolePolicies"
              - "iam:ListAttachedRolePolicies"
              - "iam:CreateInstanceProfile"
              - "iam:DeleteInstanceProfile"
              - "iam:GetInstanceProfile"
              - "iam:TagInstanceProfile"
              - "iam:UntagInstanceProfile"
              - "iam:AddRoleToInstanceProfile"
              - "iam:RemoveRoleFromInstanceProfile"
              - "iam:ListInstanceProfilesForRole"
            Resource: "*"
          - Sid: StsReadOnly
            Effect: Allow
            Action:
              - "sts:GetCallerIdentity"
            Resource: "*"

  LabAccessKey:
    Type: AWS::IAM::AccessKey
    Properties:
      UserName: !Ref LabUser

Outputs:
  AccessKeyId:
    Description: Put this in bellu-cloud-lab/.env as AWS_ACCESS_KEY_ID
    Value: !Ref LabAccessKey

  SecretAccessKey:
    Description: >
      Put this in bellu-cloud-lab/.env as AWS_SECRET_ACCESS_KEY. Shown here only
      because this is a disposable test credential; delete the stack to revoke.
    Value: !GetAtt LabAccessKey.SecretAccessKey

  UserArn:
    Description: ARN of the lab IAM user.
    Value: !GetAtt LabUser.Arn
