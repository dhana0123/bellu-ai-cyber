# HTTP-only server. Used when no TLS certificate is present yet (first boot,
# before certbot has issued one). It serves the app AND the ACME HTTP-01
# challenge, so you can obtain a cert with the webroot method without taking the
# site down. Once a cert exists, the entrypoint swaps in nginx.https.conf and
# this file is no longer used.
server {
    listen 80;
    listen [::]:80;
    server_name dev.belluai.com _;

    # ACME HTTP-01 challenge. certbot --webroot writes files here; serve them
    # over plain HTTP so Let's Encrypt can validate domain ownership.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    root /usr/share/nginx/html;
    index index.html;

    # Serve the SPA; fall back to index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the bellu-api service on the compose network.
    location /api/ {
        proxy_pass http://bellu-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
