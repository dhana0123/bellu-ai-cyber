# Load any JSON dashboards placed under /var/lib/grafana/dashboards on boot.
apiVersion: 1

providers:
  - name: Bellu
    orgId: 1
    folder: Bellu
    type: file
    disableDeletion: false
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
