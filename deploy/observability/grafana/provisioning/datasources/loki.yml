# Auto-provision the Loki datasource so Grafana is query-ready on first boot.
apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    uid: bellu-loki
    url: http://loki:3100
    isDefault: true
    jsonData:
      # Allow longer ranges when scanning container history.
      maxLines: 2000
    editable: true
