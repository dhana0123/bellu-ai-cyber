AWSTemplateFormatVersion: "2010-09-09"
Description: >
  bellu-global-intel - Global Intelligence ingestion plane. Provisions the
  infrastructure the bellu-intel CLI runs on: private S3 (immutable raw
  intelligence + signed release artifacts), RDS PostgreSQL (canonical system of
  record), Amazon OpenSearch (fast search/index), an ECR repo + ECS Fargate
  scheduled task driven by EventBridge, Secrets Manager, a VPC with private
  subnets, security groups, IAM, and CloudWatch. Infrastructure only: this
  stack creates the stack; bellu-global-intel fetches, normalizes, stores,
  indexes, and releases intelligence.

# ---------------------------------------------------------------------------
# Parameters
# ---------------------------------------------------------------------------
Parameters:
  EnvironmentType:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
    Description: >
      dev = cost-optimized single-AZ (RDS single instance, 1 NAT GW, single-node
      OpenSearch). prod = multi-AZ HA (RDS Multi-AZ, NAT GW per AZ, 2-node
      OpenSearch with zone awareness).

  ContainerImage:
    Type: String
    Default: ""
    Description: >
      Full image URI (repo:tag) the Fargate task runs. Leave empty on first
      create to use the ECR repo this stack creates at tag 'latest'; build and
      push the image (see deploy/global-intel/deploy.sh), then update the stack
      with the pushed image URI.

  ScheduleExpression:
    Type: String
    Default: "cron(0 6 * * ? *)"
    Description: >
      EventBridge schedule for the daily full-schedule intelligence run (UTC).
      Default is 06:00 UTC daily. Use rate()/cron() syntax.

  RunCommand:
    Type: CommaDelimitedList
    Default: "run,--mode,daily,--raw-dir,/app/intel-raw"
    Description: >
      Container command override the scheduled task runs (bellu-intel CLI args).

  DBName:
    Type: String
    Default: bellu
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9_]*"
    Description: Initial PostgreSQL database name.

  DBUsername:
    Type: String
    Default: bellu
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9_]*"
    Description: PostgreSQL master username (password is generated into Secrets Manager).

  VpcCidr:
    Type: String
    Default: "10.42.0.0/16"
    Description: CIDR block for the stack VPC.

  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 180, 365]
    Description: CloudWatch Logs retention for the Fargate task.

# ---------------------------------------------------------------------------
# Metadata (console grouping)
# ---------------------------------------------------------------------------
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Environment }
        Parameters: [EnvironmentType, VpcCidr]
      - Label: { default: Compute & Scheduling }
        Parameters: [ContainerImage, ScheduleExpression, RunCommand, LogRetentionDays]
      - Label: { default: Database }
        Parameters: [DBName, DBUsername]

# ---------------------------------------------------------------------------
# Mappings & Conditions - the single toggle that drives dev vs prod topology
# ---------------------------------------------------------------------------
Mappings:
  EnvMap:
    dev:
      DBInstanceClass: db.t3.micro
      DBAllocatedStorage: "20"
      DBMultiAZ: "false"
      OpenSearchInstanceType: t3.small.search
      OpenSearchInstanceCount: "1"
      OpenSearchZoneAwareness: "false"
      TaskCpu: "512"
      TaskMemory: "1024"
    prod:
      DBInstanceClass: db.m6g.large
      DBAllocatedStorage: "100"
      DBMultiAZ: "true"
      OpenSearchInstanceType: m6g.large.search
      OpenSearchInstanceCount: "2"
      OpenSearchZoneAwareness: "true"
      TaskCpu: "1024"
      TaskMemory: "2048"

Conditions:
  IsProd: !Equals [!Ref EnvironmentType, prod]
  # When no image is supplied, point the task at the stack's own ECR repo:latest.
  UseEcrLatest: !Equals [!Ref ContainerImage, ""]

# ===========================================================================
# Resources
# ===========================================================================
Resources:

  # -------------------------------------------------------------------------
  # Networking: a VPC with 2 public + 2 private subnets across two AZs. The
  # Fargate task and data stores live in the private subnets; egress to the
  # internet (upstream intel sources) goes through NAT. prod gets a NAT GW per
  # AZ for HA; dev shares a single NAT GW to save cost.
  # -------------------------------------------------------------------------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-vpc" }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-igw" }]

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 16, 12]]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-public-1" }]

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 16, 12]]
      MapPublicIpOnLaunch: true
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-public-2" }]

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Select [2, !Cidr [!Ref VpcCidr, 16, 12]]
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-private-1" }]

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Select [3, !Cidr [!Ref VpcCidr, 16, 12]]
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-private-2" }]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-public-rt" }]

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { RouteTableId: !Ref PublicRouteTable, SubnetId: !Ref PublicSubnet1 }
  PublicSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { RouteTableId: !Ref PublicRouteTable, SubnetId: !Ref PublicSubnet2 }

  # NAT gateway(s). dev: one in AZ1 shared by both private subnets. prod: one
  # per AZ so a single-AZ failure does not sever egress.
  NatEip1:
    Type: AWS::EC2::EIP
    Properties: { Domain: vpc }
  NatGateway1:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip1.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-nat-1" }]

  NatEip2:
    Type: AWS::EC2::EIP
    Condition: IsProd
    Properties: { Domain: vpc }
  NatGateway2:
    Type: AWS::EC2::NatGateway
    Condition: IsProd
    Properties:
      AllocationId: !GetAtt NatEip2.AllocationId
      SubnetId: !Ref PublicSubnet2
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-nat-2" }]

  PrivateRouteTable1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-private-rt-1" }]
  PrivateDefaultRoute1:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable1
      DestinationCidrBlock: "0.0.0.0/0"
      NatGatewayId: !Ref NatGateway1
  PrivateSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { RouteTableId: !Ref PrivateRouteTable1, SubnetId: !Ref PrivateSubnet1 }

  PrivateRouteTable2:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-private-rt-2" }]
  PrivateDefaultRoute2:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable2
      DestinationCidrBlock: "0.0.0.0/0"
      # prod routes AZ2 through its own NAT GW; dev falls back to the AZ1 NAT GW.
      NatGatewayId: !If [IsProd, !Ref NatGateway2, !Ref NatGateway1]
  PrivateSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { RouteTableId: !Ref PrivateRouteTable2, SubnetId: !Ref PrivateSubnet2 }

  # -------------------------------------------------------------------------
  # S3: private, encrypted, versioned storage. The raw bucket holds immutable
  # upstream payloads (content-addressed by sha256) and the releases bucket
  # holds signed .tar.zst release artifacts. Object Lock + a retention default
  # enforce immutability of raw intelligence (Requirement 2.3 / 7).
  # -------------------------------------------------------------------------
  RawBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${AWS::StackName}-raw-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: aws:kms, KMSMasterKeyID: !Ref DataKmsKey }
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: { Status: Enabled }
      # Object Lock makes stored raw payloads write-once (immutable).
      ObjectLockEnabled: true
      ObjectLockConfiguration:
        ObjectLockEnabled: Enabled
        Rule:
          DefaultRetention:
            Mode: GOVERNANCE
            Days: 3650
      LifecycleConfiguration:
        Rules:
          - Id: expire-noncurrent
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 90 }
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-raw" }]

  ReleasesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${AWS::StackName}-releases-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: aws:kms, KMSMasterKeyID: !Ref DataKmsKey }
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: { Status: Enabled }
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-releases" }]

  # Deny any non-TLS access to either bucket.
  RawBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref RawBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt RawBucket.Arn
              - !Sub "${RawBucket.Arn}/*"
            Condition: { Bool: { "aws:SecureTransport": "false" } }

  ReleasesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ReleasesBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt ReleasesBucket.Arn
              - !Sub "${ReleasesBucket.Arn}/*"
            Condition: { Bool: { "aws:SecureTransport": "false" } }

  # Gateway VPC endpoint for S3 so raw/release traffic stays on the AWS network
  # (no NAT data charges for S3, and it works even if egress is locked down).
  S3VpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref PrivateRouteTable1, !Ref PrivateRouteTable2]

  # -------------------------------------------------------------------------
  # KMS key encrypting RDS, OpenSearch, S3, and Secrets Manager data at rest.
  # -------------------------------------------------------------------------
  DataKmsKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub "${AWS::StackName} data-at-rest encryption key"
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableRoot
            Effect: Allow
            Principal: { AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root" }
            Action: "kms:*"
            Resource: "*"

  DataKmsAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${AWS::StackName}-data"
      TargetKeyId: !Ref DataKmsKey

  # -------------------------------------------------------------------------
  # Security groups. The task SG is the only ingress source for RDS and
  # OpenSearch, so the data stores accept connections solely from the pipeline.
  # -------------------------------------------------------------------------
  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${AWS::StackName} Fargate task SG (egress only)"
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: "0.0.0.0/0"
          Description: Egress to upstream intel sources + AWS APIs
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-task-sg" }]

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${AWS::StackName} RDS PostgreSQL SG"
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-db-sg" }]

  DatabaseIngressFromTask:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DatabaseSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref TaskSecurityGroup
      Description: PostgreSQL from the pipeline task only

  SearchSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "${AWS::StackName} OpenSearch SG"
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-search-sg" }]

  SearchIngressFromTask:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref SearchSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref TaskSecurityGroup
      Description: HTTPS to OpenSearch from the pipeline task only

  # -------------------------------------------------------------------------
  # Secrets Manager: the RDS master credentials. The password is generated by
  # CloudFormation and never appears in the template or parameters.
  # -------------------------------------------------------------------------
  DBSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AWS::StackName}/db/credentials"
      Description: !Sub "${AWS::StackName} RDS PostgreSQL master credentials"
      KmsKeyId: !Ref DataKmsKey
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username":"${DBUsername}"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\ '''

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "${AWS::StackName} DB subnet group (private)"
      SubnetIds: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub "${AWS::StackName}-pg"
      Engine: postgres
      EngineVersion: "16.4"
      DBName: !Ref DBName
      DBInstanceClass: !FindInMap [EnvMap, !Ref EnvironmentType, DBInstanceClass]
      AllocatedStorage: !FindInMap [EnvMap, !Ref EnvironmentType, DBAllocatedStorage]
      StorageType: gp3
      StorageEncrypted: true
      KmsKeyId: !Ref DataKmsKey
      MultiAZ: !FindInMap [EnvMap, !Ref EnvironmentType, DBMultiAZ]
      MasterUsername: !Sub "{{resolve:secretsmanager:${DBSecret}:SecretString:username}}"
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DBSecret}:SecretString:password}}"
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      PubliclyAccessible: false
      BackupRetentionPeriod: !If [IsProd, 14, 7]
      DeletionProtection: !If [IsProd, true, false]
      EnablePerformanceInsights: !If [IsProd, true, false]
      CopyTagsToSnapshot: true
      AutoMinorVersionUpgrade: true
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-pg" }]

  # Attach the DB connection endpoint (host/port/dbname) to the credential
  # secret so the pipeline resolves one secret for the whole DSN.
  DBSecretAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref DBSecret
      TargetId: !Ref Database
      TargetType: AWS::RDS::DBInstance

  # -------------------------------------------------------------------------
  # Amazon OpenSearch Service: the fast search/index layer. PostgreSQL remains
  # authoritative; this index is rebuildable from it. Node count + zone
  # awareness scale with EnvironmentType. Fine-grained access + HTTPS enforced;
  # it lives in the private subnets reachable only from the task SG.
  # -------------------------------------------------------------------------
  SearchDomain:
    Type: AWS::OpenSearchService::Domain
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DomainName: !Sub "${AWS::StackName}-search"
      EngineVersion: "OpenSearch_2.13"
      ClusterConfig:
        InstanceType: !FindInMap [EnvMap, !Ref EnvironmentType, OpenSearchInstanceType]
        InstanceCount: !FindInMap [EnvMap, !Ref EnvironmentType, OpenSearchInstanceCount]
        ZoneAwarenessEnabled: !FindInMap [EnvMap, !Ref EnvironmentType, OpenSearchZoneAwareness]
      EBSOptions:
        EBSEnabled: true
        VolumeType: gp3
        VolumeSize: !If [IsProd, 100, 20]
      EncryptionAtRestOptions: { Enabled: true, KmsKeyId: !Ref DataKmsKey }
      NodeToNodeEncryptionOptions: { Enabled: true }
      DomainEndpointOptions:
        EnforceHTTPS: true
        TLSSecurityPolicy: Policy-Min-TLS-1-2-2019-07
      VPCOptions:
        SecurityGroupIds: [!Ref SearchSecurityGroup]
        SubnetIds: !If
          - IsProd
          - [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
          - [!Ref PrivateSubnet1]
      AccessPolicies:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { AWS: !GetAtt TaskRole.Arn }
            Action: "es:ESHttp*"
            Resource: !Sub "arn:${AWS::Partition}:es:${AWS::Region}:${AWS::AccountId}:domain/${AWS::StackName}-search/*"

  # -------------------------------------------------------------------------
  # ECR repository for the bellu-intel image (built from
  # deploy/global-intel/Dockerfile.intel and pushed by deploy.sh).
  # -------------------------------------------------------------------------
  EcrRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub "${AWS::StackName}"
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration: { ScanOnPush: true }
      EncryptionConfiguration: { EncryptionType: AES256 }
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the 10 most recent images",
                "selection": { "tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 10 },
                "action": { "type": "expire" }
              }
            ]
          }

  # -------------------------------------------------------------------------
  # CloudWatch Logs for the task.
  # -------------------------------------------------------------------------
  LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/ecs/${AWS::StackName}"
      RetentionInDays: !Ref LogRetentionDays

  # -------------------------------------------------------------------------
  # IAM. Two roles, least-privilege:
  #   ExecutionRole - lets ECS pull the image and write logs, and read the DB
  #                   secret so it can inject the DSN as a container secret.
  #   TaskRole      - the identity the pipeline itself assumes at runtime: S3
  #                   read/write to the two buckets, OpenSearch HTTP, the DB
  #                   secret, and KMS decrypt.
  # -------------------------------------------------------------------------
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-exec"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"
      Policies:
        - PolicyName: read-db-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue]
                Resource: !Ref DBSecret
              - Effect: Allow
                Action: [kms:Decrypt]
                Resource: !GetAtt DataKmsKey.Arn

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-task"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: intel-runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Raw bucket: write immutable payloads, read them back for parsing.
              - Sid: RawBucketObjects
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:ListBucket, s3:GetObjectRetention, s3:PutObjectRetention]
                Resource:
                  - !GetAtt RawBucket.Arn
                  - !Sub "${RawBucket.Arn}/*"
              # Releases bucket: write signed bundles, read for import/verify.
              - Sid: ReleasesBucketObjects
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:ListBucket]
                Resource:
                  - !GetAtt ReleasesBucket.Arn
                  - !Sub "${ReleasesBucket.Arn}/*"
              - Sid: SearchHttp
                Effect: Allow
                Action: [es:ESHttpGet, es:ESHttpPut, es:ESHttpPost, es:ESHttpDelete, es:ESHttpHead]
                Resource: !Sub "arn:${AWS::Partition}:es:${AWS::Region}:${AWS::AccountId}:domain/${AWS::StackName}-search/*"
              - Sid: ReadDbSecret
                Effect: Allow
                Action: [secretsmanager:GetSecretValue]
                Resource: !Ref DBSecret
              - Sid: KmsData
                Effect: Allow
                Action: [kms:Decrypt, kms:GenerateDataKey]
                Resource: !GetAtt DataKmsKey.Arn

  # -------------------------------------------------------------------------
  # ECS cluster + Fargate task definition running the bellu-intel CLI.
  # -------------------------------------------------------------------------
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${AWS::StackName}"
      ClusterSettings: [{ Name: containerInsights, Value: enabled }]

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AWS::StackName}-intel"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !FindInMap [EnvMap, !Ref EnvironmentType, TaskCpu]
      Memory: !FindInMap [EnvMap, !Ref EnvironmentType, TaskMemory]
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      RuntimePlatform: { CpuArchitecture: X86_64, OperatingSystemFamily: LINUX }
      ContainerDefinitions:
        - Name: bellu-intel
          Image: !If
            - UseEcrLatest
            - !Sub "${EcrRepository.RepositoryUri}:latest"
            - !Ref ContainerImage
          Essential: true
          Command: !Ref RunCommand
          Environment:
            - { Name: BELLU_RAW_BUCKET, Value: !Ref RawBucket }
            - { Name: BELLU_RELEASES_BUCKET, Value: !Ref ReleasesBucket }
            - { Name: BELLU_SEARCH_ENDPOINT, Value: !Sub "https://${SearchDomain.DomainEndpoint}" }
            - { Name: BELLU_ENVIRONMENT, Value: !Ref EnvironmentType }
            - { Name: AWS_REGION, Value: !Ref "AWS::Region" }
          # The DB DSN is assembled from the secret's JSON fields, so no
          # credential ever lands in the task definition in plaintext.
          Secrets:
            - { Name: BELLU_DB_HOST, ValueFrom: !Sub "${DBSecret}:host::" }
            - { Name: BELLU_DB_PORT, ValueFrom: !Sub "${DBSecret}:port::" }
            - { Name: BELLU_DB_NAME, ValueFrom: !Sub "${DBSecret}:dbname::" }
            - { Name: BELLU_DB_USER, ValueFrom: !Sub "${DBSecret}:username::" }
            - { Name: BELLU_DB_PASSWORD, ValueFrom: !Sub "${DBSecret}:password::" }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref "AWS::Region"
              awslogs-stream-prefix: intel

  # -------------------------------------------------------------------------
  # EventBridge schedule: run the Fargate task on ScheduleExpression. This is
  # the only trigger — infra does not fetch; it schedules bellu-intel, which
  # fetches/normalizes/stores/indexes/releases.
  # -------------------------------------------------------------------------
  EventsInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-events"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: events.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: run-task
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [ecs:RunTask]
                Resource: !Ref TaskDefinition
                Condition:
                  ArnEquals: { "ecs:cluster": !GetAtt Cluster.Arn }
              - Effect: Allow
                Action: [iam:PassRole]
                Resource: [!GetAtt ExecutionRole.Arn, !GetAtt TaskRole.Arn]

  DailyRunRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-daily-run"
      Description: Scheduled bellu-intel full-schedule intelligence run
      ScheduleExpression: !Ref ScheduleExpression
      State: ENABLED
      Targets:
        - Id: fargate-intel-run
          Arn: !GetAtt Cluster.Arn
          RoleArn: !GetAtt EventsInvokeRole.Arn
          EcsParameters:
            TaskDefinitionArn: !Ref TaskDefinition
            LaunchType: FARGATE
            TaskCount: 1
            PlatformVersion: LATEST
            NetworkConfiguration:
              AwsVpcConfiguration:
                AssignPublicIp: DISABLED
                Subnets: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
                SecurityGroups: [!Ref TaskSecurityGroup]

# ===========================================================================
# Outputs
# ===========================================================================
Outputs:
  EcrRepositoryUri:
    Description: Push the bellu-intel image here, then update ContainerImage.
    Value: !GetAtt EcrRepository.RepositoryUri
    Export: { Name: !Sub "${AWS::StackName}-EcrRepositoryUri" }
  RawBucketName:
    Description: Immutable raw intelligence bucket.
    Value: !Ref RawBucket
    Export: { Name: !Sub "${AWS::StackName}-RawBucket" }
  ReleasesBucketName:
    Description: Signed release-artifact bucket.
    Value: !Ref ReleasesBucket
    Export: { Name: !Sub "${AWS::StackName}-ReleasesBucket" }
  DatabaseEndpoint:
    Description: RDS PostgreSQL endpoint address.
    Value: !GetAtt Database.Endpoint.Address
    Export: { Name: !Sub "${AWS::StackName}-DbEndpoint" }
  DBSecretArn:
    Description: Secrets Manager ARN holding the DB credentials + connection info.
    Value: !Ref DBSecret
    Export: { Name: !Sub "${AWS::StackName}-DbSecretArn" }
  SearchEndpoint:
    Description: OpenSearch domain HTTPS endpoint (VPC-internal).
    Value: !Sub "https://${SearchDomain.DomainEndpoint}"
    Export: { Name: !Sub "${AWS::StackName}-SearchEndpoint" }
  ClusterName:
    Description: ECS cluster running the scheduled task.
    Value: !Ref Cluster
    Export: { Name: !Sub "${AWS::StackName}-Cluster" }
  TaskDefinitionArn:
    Description: Fargate task definition for the bellu-intel pipeline.
    Value: !Ref TaskDefinition
  VpcId:
    Value: !Ref Vpc
    Export: { Name: !Sub "${AWS::StackName}-VpcId" }
  PrivateSubnets:
    Value: !Join [",", [!Ref PrivateSubnet1, !Ref PrivateSubnet2]]
    Export: { Name: !Sub "${AWS::StackName}-PrivateSubnets" }
