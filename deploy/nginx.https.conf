# HTTPS server. Used once a TLS certificate exists at
# /etc/letsencrypt/live/dev.belluai.com/. Port 80 keeps serving the ACME
# challenge (so renewals work) and redirects everything else to HTTPS; port 443
# serves the app and proxies /api with TLS terminated here.

server {
    listen 80;
    listen [::]:80;
    server_name dev.belluai.com;

    # Keep serving ACME challenges on HTTP so certbot renew (webroot) works.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else goes to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dev.belluai.com;

    ssl_certificate     /etc/letsencrypt/live/dev.belluai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.belluai.com/privkey.pem;

    # Reasonable modern TLS defaults.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the SPA; fall back to index.html for client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the bellu-api service on the compose network.
    location /api/ {
        proxy_pass http://bellu-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events (discovery progress stream) must not be buffered.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
