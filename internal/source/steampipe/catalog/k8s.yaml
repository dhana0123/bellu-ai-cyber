# Steampipe Kubernetes catalog. One connection per cluster (EKS/AKS/GKE).
# Columns follow the Steampipe Kubernetes plugin schema; confirm with
# `.inspect <table>`.
provider: k8s
connection: kubernetes

tables:
  - table: kubernetes_namespace
    id_column: uid
    scope_column: name

  - table: kubernetes_service_account
    id_column: uid
    scope_column: namespace

  - table: kubernetes_pod
    id_column: uid
    scope_column: namespace

  - table: kubernetes_deployment
    id_column: uid
    scope_column: namespace
