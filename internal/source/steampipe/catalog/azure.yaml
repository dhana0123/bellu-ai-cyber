# Steampipe Azure catalog. Columns follow the Steampipe Azure plugin schema.
# Confirm with `.inspect <table>` for a given plugin version.
provider: azure
connection: azure

tables:
  - table: azure_subscription
    id_column: subscription_id
    scope_column: subscription_id

  - table: azure_app_registration
    resource_type: azure_managed_identity
    id_column: id
    scope_column: subscription_id

  - table: azure_role_assignment
    id_column: id
    scope_column: subscription_id

  - table: azure_role_definition
    id_column: id
    scope_column: subscription_id

  - table: azure_storage_account
    id_column: id
    scope_column: subscription_id
    region_column: region

  - table: azure_compute_virtual_machine
    id_column: id
    scope_column: subscription_id
    region_column: region

  - table: azure_kubernetes_cluster
    id_column: id
    scope_column: subscription_id
    region_column: region

  - table: azure_container_app
    id_column: id
    scope_column: subscription_id
    region_column: region

  - table: azure_cognitive_account
    resource_type: azure_openai
    id_column: id
    scope_column: subscription_id
    region_column: region
